services:
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: monitor-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${BIND_IP}:${PGADMIN_PORT}:80"
    networks:
      - monitor-net

  redis-insight:
    image: redis/redisinsight:${REDIS_INSIGHT_VERSION}
    container_name: monitor-redis-insight
    restart: always
    ports:
      - "${BIND_IP}:${REDIS_INSIGHT_PORT}:5540"
    networks:
      - monitor-net

networks:
  monitor-net:
    external: true
    name: ${NETWORK_NAME}