version: '3.8'

services:
  mailu-front:
    image: ghcr.io/mailu/nginx:2024.06
    container_name: monitor-mailu-front
    restart: always
    environment:
      - HTTP_PORT=80
      - HTTPS_PORT=443
      - ADMIN_PORT=8080
      - WEBMAIL_PORT=8080
      - WEBROOT=/
      - TLS_FLAVOR=notls
      - HOSTNAMES=${MAILU_HOSTNAME:-mail.monitor.com}
    ports:
      - "${MAILU_HTTP_PORT:-8025}:80"
      - "${MAILU_SMTP_PORT:-25}:25"
      - "${MAILU_SUBMISSION_PORT:-587}:587"
      - "${MAILU_IMAP_PORT:-143}:143"
    volumes:
      - mailu_certs:/certs
    networks:
      - monitor-net

  mailu-admin:
    image: ghcr.io/mailu/admin:2024.06
    container_name: monitor-mailu-admin
    restart: always
    environment:
      - SECRET_KEY=${MAILU_SECRET_KEY:-ChangeMeToAVeryLongAndSecretKey123!}
      - DOMAIN=${MAILU_DOMAIN:-monitor.com}
      - HOSTNAMES=${MAILU_HOSTNAME:-mail.monitor.com}
      - POSTMASTER=admin
      - TLS_FLAVOR=notls
      - ADMIN_ACCOUNT_PWD=${MAILU_ADMIN_PWD:-Admin@123}
      - BIND_ADDRESS4=0.0.0.0
      # Chuyển sang PostgreSQL
      - DB_SUITE=postgres
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PW=${POSTGRES_PASSWORD:-Admin@123}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB_MAILU:-mailu_db}
      - INITIAL_ADMIN_ACCOUNT=admin
      - INITIAL_ADMIN_DOMAIN=${MAILU_DOMAIN:-monitor.com}
      - INITIAL_ADMIN_PW=${MAILU_ADMIN_PWD:-Admin@123}
    depends_on:
      - postgres
    volumes:
      - mailu_data:/data
    networks:
      - monitor-net

  mailu-imap:
    image: ghcr.io/mailu/dovecot:2024.06
    container_name: monitor-mailu-imap
    restart: always
    environment:
      - DOMAIN=${MAILU_DOMAIN:-monitor.com}
      - HOSTNAMES=${MAILU_HOSTNAME:-mail.monitor.com}
      - POSTMASTER=admin
      - TLS_FLAVOR=notls
    volumes:
      - mailu_mail:/mail
    networks:
      - monitor-net

  mailu-smtp:
    image: ghcr.io/mailu/postfix:2024.06
    container_name: monitor-mailu-smtp
    restart: always
    environment:
      - DOMAIN=${MAILU_DOMAIN:-monitor.com}
      - HOSTNAMES=${MAILU_HOSTNAME:-mail.monitor.com}
      - POSTMASTER=admin
      - TLS_FLAVOR=notls
    networks:
      - monitor-net

  mailu-webmail:
    image: ghcr.io/mailu/snappymail:2024.06
    container_name: monitor-mailu-webmail
    restart: always
    environment:
      - WEBMAIL=snappymail
    volumes:
      - mailu_webmail:/data
    networks:
      - monitor-net

  postgres:
    image: postgres:16-alpine
    container_name: monitor-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB_MONITOR:-monitor_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin@123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - monitor-net

  redis:
    image: redis:7-alpine
    container_name: monitor-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-Admin@123}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Admin@123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitor-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: monitor-keycloak
    command: start-dev --import-realm
    restart: always
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin@123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_KEYCLOAK:-keycloak_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-Admin@123}
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      - postgres
    networks:
      - monitor-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: monitor-kafka
    restart: always
    user: root
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:${KAFKA_PORT:-9092}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - monitor-net

networks:
  monitor-net:
    driver: bridge
    name: monitor-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  mailu_data:
  mailu_mail:
  mailu_webmail:
  mailu_certs: