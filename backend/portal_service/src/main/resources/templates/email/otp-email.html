<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background-color: #f4f6f8; padding: 40px 0;">

    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="
                       max-width: 600px;
                       width: 100%;
                       background-color: #ffffff;
                       border-radius: 10px;
                       overflow: hidden;
                   ">

                <tr>
                    <td align="center"
                        style="
                            background-color: #007bff;
                            padding: 30px 20px;
                        ">

                        <h1 style="
                            margin: 0;
                            color: #ffffff;
                            font-size: 22px;
                            font-weight: 600;
                        ">
                            {{title}}
                        </h1>

                    </td>
                </tr>

                <tr>
                    <td style="
                        padding: 40px 30px;
                        color: #444444;
                        font-size: 15px;
                        line-height: 1.6;
                    ">

                        <p style="margin: 0 0 20px 0;">
                            {{message}}
                        </p>

                        <table width="100%" cellpadding="0" cellspacing="0" border="0"
                               style="margin: 30px 0;">

                            <tr>
                                <td align="center">

                                    <div style="
                                        display: inline-block;
                                        background-color: #f4f8ff;
                                        border: 2px dashed #007bff;
                                        border-radius: 8px;
                                        padding: 15px 35px;
                                    ">

                                        <span style="
                                            font-size: 32px;
                                            font-weight: bold;
                                            letter-spacing: 8px;
                                            color: #007bff;
                                        ">
                                            {{otp}}
                                        </span>

                                    </div>

                                </td>
                            </tr>

                        </table>

                        <p style="
                            margin: 0;
                            color: #666666;
                            font-size: 13px;
                            text-align: center;
                        ">
                            {{expireMessage}}
                        </p>

                        <hr style="
                            margin: 30px 0;
                            border: none;
                            border-top: 1px solid #eeeeee;
                        ">

                        <p style="
                            margin: 0;
                            color: #888888;
                            font-size: 12px;
                            line-height: 1.6;
                        ">
                            {{footerMessage}}
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
