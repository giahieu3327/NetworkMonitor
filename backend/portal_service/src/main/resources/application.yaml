server:
  port: ${PORTAL_SERVER_PORT:5000}

spring:
  application:
    name: portal_service

  # 1. Primary Datasource (monitor_db)
  datasource:
    hikari:
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_MONITOR:monitor_db}
      username: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:Admin@123}
      driver-class-name: org.postgresql.Driver

  # 2. Camunda Datasource (camunda_db)
  camunda-datasource:
    hikari:
      jdbc-url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB_CAMUNDA:camunda_db}
      username: ${POSTGRES_USER:postgres}
      password: ${POSTGRES_PASSWORD:Admin@123}
      driver-class-name: org.postgresql.Driver

  # 3. JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true

  # 4. Flyway Migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 5. Redis Config
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:Admin@123}
      timeout: 60s
      database: 0

  # 6. Redis Cache
  cache:
    type: redis
    redis:
      time-to-live: 600000ms
      cache-null-values: false

  # 7. OAuth2 Resource Server (Keycloak Integration)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:monitor-realm}
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}/realms/${KEYCLOAK_REALM:monitor-realm}/protocol/openid-connect/certs

  # 8. Kafka Config
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: application-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # 9. Mail Service Config (Stalwart Mail Server)
  mail:
    host: ${STALWART_HOST:localhost}
    port: ${STALWART_SUBMISSION_PORT:587}
    username: ${STALWART_MAIL_USER:admin@monitor.com}
    password: ${STALWART_MAIL_PASSWORD:Admin@123}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false


# 10. Camunda BPMN Engine Config
camunda:
  bpm:
    admin-user:
      id: ${CAMUNDA_ADMIN_ID:camunda-admin}
      password: ${CAMUNDA_ADMIN_PASSWORD:Admin@123}
      first-name: Camunda
      last-name: Admin

    filter:
      create: All tasks

    job-execution:
      enabled: true

    database-schema-update: true


# 11. Keycloak Admin Client Config
keycloak:
  server-url: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8080}
  realm: ${KEYCLOAK_REALM:monitor-realm}

  admin:
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:Admin@123}
    client-id: admin-cli

  user-client-id: ${KEYCLOAK_CLIENT_ID:monitor-frontend}


# 12. Default Application Admin
app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@monitor.com}
    password: ${APP_ADMIN_PASSWORD:Admin@123}
    full-name: System Administrator
    phone: "0900000000"
    role: ROLE_SUPER_ADMIN


# 13. MyBatis Config
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.network_monitor.portal_service.model.entity

  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


# 14. JasperReports Template Path
jasper:
  report:
    template-path: classpath:reports/


# 15. SpringDoc OpenAPI (Swagger UI)
springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html


# 16. Logging
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.schema: TRACE
    org.hibernate.tool.schema: TRACE
    org.camunda.bpm.engine: INFO
    com.network_monitor.portal_service: DEBUG