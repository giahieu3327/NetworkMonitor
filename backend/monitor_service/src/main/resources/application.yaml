server:
  port: ${MONITOR_SERVER_PORT:5001}

spring:
  application:
    name: monitor_service

  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:monitor_local.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: monitor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

monitoring:
  snmp:
    timeout: ${SNMP_TIMEOUT:1500}
    retries: ${SNMP_RETRIES:2}

  syslog:
    port: ${SYSLOG_PORT:5140}
    protocol: ${SYSLOG_PROTOCOL:udp}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      show-components: always

  info:
    env:
      enabled: true

info:
  app:
    name: "NMS Monitor Service"
    description: "Network Monitoring System Monitor Service"
    version: "1.0.0"

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: INFO
    com.network_monitor.monitor_service: DEBUG