server:
  port: ${MONITOR_SERVER_PORT:5001}

spring:
  application:
    name: monitor_service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: monitor-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.network_monitor.monitor_service.model.dto.kafka"
        spring.json.value.default.type: "com.network_monitor.monitor_service.model.dto.kafka.KafkaMessage"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      retries: 4
      retry-backoff-ms: 100

    listener:
      ack-mode: record

monitoring:
  snmp:
    timeout: ${SNMP_TIMEOUT:1500}
    retries: ${SNMP_RETRIES:2}

  syslog:
    port: ${SYSLOG_PORT:5140}
    protocol: ${SYSLOG_PROTOCOL:udp}

info:
  app:
    name: "NMS Monitor Service"
    description: "Network Monitoring System Monitor Service"
    version: "1.0.0"

logging:
  level:
    root: WARN
    com.network_monitor.monitor_service: DEBUG
    org.springframework: WARN
    org.springframework.boot: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN