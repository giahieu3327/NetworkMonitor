server:
  port: 5000

spring:
  application:
    name: monitor-backend

  # 1. Database PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/monitor_db
    username: postgres
    password: Admin@123
    driver-class-name: org.postgresql.Driver

  # 2. JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate   # Khuyên dùng validate khi đã dùng Flyway quản lý migration
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  # 3. Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # 4. Redis Config (Cấu hình chuẩn từ Spring Boot 3/4)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60s
      database: 0

  # 5. Redis Cache (Cache-Aside Pattern)
  cache:
    type: redis
    redis:
      time-to-live: 600000ms  # 10 phút mặc định cho cache
      cache-null-values: false

  # 6. OAuth2 Resource Server (Keycloak Integration)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/monitor-realm
          jwk-set-uri: http://localhost:8080/realms/monitor-realm/protocol/openid-connect/certs

# 7. MyBatis Config
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.monitor.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 8. SpringDoc OpenAPI (Swagger)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 9. Logging
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.monitor: DEBUG